[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-decision-mcp"
version = "1.0.0"
description = "Independent, fail-closed TypeSafe Jev decision service"
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0", "typesafe-sdk==0.7.5", "pydantic-settings==2.16.3", "uvicorn==0.54.0"]

[project.optional-dependencies]
test = ["pytest==9.2.0", "pytest-asyncio==1.5.0", "httpx==0.28.1"]

[project.scripts]
jev-decision-mcp = "jev_decision.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
markers = ["live: explicitly enabled billable TypeSafe API test"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
