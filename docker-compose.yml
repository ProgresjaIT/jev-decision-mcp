services:
  jev:
    image: ${JEV_IMAGE:-jev-decision-mcp:local}
    build: .
    env_file: ${JEV_ENV_FILE:-.env}
    ports:
      - "127.0.0.1:${MCP_PORT:-8765}:${PORT:-8765}"
    volumes:
      - history:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'
    healthcheck:
      test: ["CMD", "python", "-m", "jev_decision.probe"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 15s
volumes:
  history:
    name: ${JEV_DATA_VOLUME:-jev-decision-data}
